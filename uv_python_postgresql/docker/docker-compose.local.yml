name: python_postgresql
services:
  app:
    container_name: python_postgresql_app
    tty: true
    build:
      context: ../
      dockerfile: docker/containers/app/Dockerfile
    ports:
      - 8000:80
    volumes:
      - ..:/app
    depends_on:
      - db
  db:
    container_name: python_postgresql_db
    image: postgres
    environment:
      - POSTGRES_USER=python_postgresql_user
      - POSTGRES_PASSWORD=Test1111
      - POSTGRES_DB=python_postgresql_db
      - POSTGRES_ADMIN_PASSWORD=Test1111
    ports:
      - 5432:5432
    volumes:
      - python_postgresql_db:/var/lib/postgresql/data
volumes:
  python_postgresql_db: